# /etc/systemd/system/gitlab-runner.service.d/limits.conf  (installed by setup-runner.sh)
# This runner shares the host with GitLab itself (7.7 GB, no swap, GitLab uses ~5.6 GB).
# With the shell executor every job is a child of this service, so these limits
# apply to the builds: a Flutter web build peaks at ~1.8 GB.
[Service]
# Hard cap: a runaway build is OOM-killed inside this cgroup, never GitLab.
MemoryMax=2G
# If the host as a whole runs out, the kernel kills the build before any GitLab process.
OOMScoreAdjust=1000
# GitLab wins every CPU and disk contention.
CPUWeight=20
IOWeight=20
Nice=10
