# /etc/nginx/sites-available/gynocamp  ->  symlink into sites-enabled  (installed by provision.sh)
# Flutter web bundle served statically; /api/ and /health proxied to the Dart API.
# HTTP only here on purpose: `certbot --nginx -d gynocamp.omwaytechnologies.com`
# adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name gynocamp.omwaytechnologies.com;

    root /srv/gynocamp/www;

    # Sync pushes can carry scanned Yellow Form images.
    client_max_body_size 20m;

    access_log /var/log/nginx/gynocamp-access.log;
    error_log  /var/log/nginx/gynocamp-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # `expires` rather than add_header: an add_header here would drop the
    # security headers inherited from conf.d/security.conf.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires 7d;
    }
}
